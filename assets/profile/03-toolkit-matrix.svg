<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">Engineering toolkit matrix</title><desc id="desc">A layered toolkit covering application development, data and search, messaging and storage, security, platform engineering, and automation.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#10132f"/></linearGradient><linearGradient id="flow"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8b5cf6" stroke-opacity=".045"/></pattern></defs>
<style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:"JetBrains Mono",Consolas,monospace}.h{fill:#f8fafc}.p{fill:#94a3b8}.a{fill:#a78bfa}</style>
<rect width="1200" height="610" rx="24" fill="url(#bg)"/><rect width="1200" height="610" rx="24" fill="url(#g)"/><rect x="1" y="1" width="1198" height="608" rx="23" fill="none" stroke="#8b5cf6" stroke-opacity=".3"/>
<text x="42" y="48" class="m a" font-size="13" letter-spacing="3">TOOLKIT MATRIX / 03</text><text x="1158" y="48" text-anchor="end" class="m p" font-size="12">TOOLS FOLLOW THE SYSTEM</text>

<g class="m" font-size="12"><rect x="88" y="82" width="1024" height="48" rx="24" fill="#080d20" stroke="#8b5cf6" stroke-opacity=".35"/><text x="140" y="111" fill="#c4b5fd">INTERFACE</text><text x="300" y="111" fill="#a78bfa">→ SERVICE</text><text x="462" y="111" fill="#a78bfa">→ EVENT</text><text x="612" y="111" fill="#67e8f9">→ DATA</text><text x="750" y="111" fill="#67e8f9">→ INTELLIGENCE</text><text x="953" y="111" fill="#e2e8f0">→ DECISION</text></g>

<!-- cards -->
<g transform="translate(42 160)">
  <g><rect width="350" height="180" rx="18" fill="#090d20" stroke="#7c3aed" stroke-opacity=".45"/><rect width="6" height="180" rx="3" fill="#7c3aed"/><text x="28" y="38" class="m a" font-size="13">01 / APPLICATION</text><text x="28" y="72" class="s h" font-size="18" font-weight="700">Product-facing systems</text><text x="28" y="106" class="m p" font-size="13">Next.js · React · Node.js</text><text x="28" y="132" class="m p" font-size="13">Express · Flask · TypeScript</text><text x="28" y="158" class="m" fill="#64748b" font-size="11">INTERFACES / APIs / SERVICES</text></g>
  <g transform="translate(382 0)"><rect width="350" height="180" rx="18" fill="#090d20" stroke="#a78bfa" stroke-opacity=".45"/><rect width="6" height="180" rx="3" fill="#a78bfa"/><text x="28" y="38" class="m a" font-size="13">02 / DATA &amp; SEARCH</text><text x="28" y="72" class="s h" font-size="18" font-weight="700">Storage with retrieval</text><text x="28" y="106" class="m p" font-size="13">MongoDB · Elasticsearch</text><text x="28" y="132" class="m p" font-size="13">Redis · Vector Search · Embeddings</text><text x="28" y="158" class="m" fill="#64748b" font-size="11">INDEX / CACHE / RETRIEVE</text></g>
  <g transform="translate(764 0)"><rect width="350" height="180" rx="18" fill="#090d20" stroke="#22d3ee" stroke-opacity=".4"/><rect width="6" height="180" rx="3" fill="#22d3ee"/><text x="28" y="38" class="m" fill="#67e8f9" font-size="13">03 / MESSAGING &amp; STORAGE</text><text x="28" y="72" class="s h" font-size="18" font-weight="700">Asynchronous by design</text><text x="28" y="106" class="m p" font-size="13">RabbitMQ · MinIO</text><text x="28" y="132" class="m p" font-size="13">WebSocket · SSE · Pipelines</text><text x="28" y="158" class="m" fill="#64748b" font-size="11">QUEUE / STREAM / OBJECT</text></g>

  <g transform="translate(0 210)"><rect width="350" height="180" rx="18" fill="#090d20" stroke="#c084fc" stroke-opacity=".42"/><rect width="6" height="180" rx="3" fill="#c084fc"/><text x="28" y="38" class="m" fill="#d8b4fe" font-size="13">04 / SECURITY</text><text x="28" y="72" class="s h" font-size="18" font-weight="700">Defense inside the design</text><text x="28" y="106" class="m p" font-size="13">OpenCTI · CIS-CAT · JWT / OAuth</text><text x="28" y="132" class="m p" font-size="13">Compliance · Hardening · AuthZ</text><text x="28" y="158" class="m" fill="#64748b" font-size="11">OBSERVE / VERIFY / DEFEND</text></g>
  <g transform="translate(382 210)"><rect width="350" height="180" rx="18" fill="#090d20" stroke="#818cf8" stroke-opacity=".42"/><rect width="6" height="180" rx="3" fill="#818cf8"/><text x="28" y="38" class="m" fill="#a5b4fc" font-size="13">05 / PLATFORM</text><text x="28" y="72" class="s h" font-size="18" font-weight="700">Repeatable environments</text><text x="28" y="106" class="m p" font-size="13">Docker · Compose · Linux</text><text x="28" y="132" class="m p" font-size="13">PM2 · Vercel · Render</text><text x="28" y="158" class="m" fill="#64748b" font-size="11">PACKAGE / RUN / OPERATE</text></g>
  <g transform="translate(764 210)"><rect width="350" height="180" rx="18" fill="#090d20" stroke="#38bdf8" stroke-opacity=".38"/><rect width="6" height="180" rx="3" fill="#38bdf8"/><text x="28" y="38" class="m" fill="#7dd3fc" font-size="13">06 / AUTOMATION</text><text x="28" y="72" class="s h" font-size="18" font-weight="700">Remove the repetition</text><text x="28" y="106" class="m p" font-size="13">Bash · PowerShell · Groovy</text><text x="28" y="132" class="m p" font-size="13">Documents · Testing · CI workflows</text><text x="28" y="158" class="m" fill="#64748b" font-size="11">SCRIPT / PROCESS / VERIFY</text></g>
</g>

<rect x="42" y="574" width="1116" height="2" fill="url(#flow)" opacity=".75"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></rect>
</svg>