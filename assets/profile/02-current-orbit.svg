<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Current engineering orbit</title><desc id="desc">Four engineering domains orbit a central systems engineering identity: backend, security, applied AI, and creative interaction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#0f1230"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8b5cf6" opacity=".12"/></pattern>
</defs>
<style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:"JetBrains Mono",Consolas,monospace}.h{fill:#f8fafc}.p{fill:#94a3b8}.a{fill:#a78bfa}</style>
<rect width="1200" height="650" rx="24" fill="url(#bg)"/><rect width="1200" height="650" rx="24" fill="url(#dots)"/><rect x="1" y="1" width="1198" height="648" rx="23" fill="none" stroke="#8b5cf6" stroke-opacity=".3"/>
<text x="42" y="50" class="m a" font-size="13" letter-spacing="3">CURRENT ORBIT / 02</text><text x="1158" y="50" text-anchor="end" class="m p" font-size="12">4 ACTIVE DOMAINS</text>

<ellipse cx="600" cy="345" rx="380" ry="220" fill="none" stroke="#8b5cf6" stroke-opacity=".24" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="5s" repeatCount="indefinite"/></ellipse>
<ellipse cx="600" cy="345" rx="270" ry="155" fill="none" stroke="#22d3ee" stroke-opacity=".14" stroke-dasharray="4 11"><animate attributeName="stroke-dashoffset" from="0" to="60" dur="7s" repeatCount="indefinite"/></ellipse>
<circle cx="600" cy="345" r="112" fill="#080d20" stroke="url(#ring)" stroke-width="2" filter="url(#glow)"/>
<circle cx="600" cy="345" r="93" fill="none" stroke="#8b5cf6" stroke-opacity=".23" stroke-dasharray="3 7"><animateTransform attributeName="transform" type="rotate" from="0 600 345" to="360 600 345" dur="16s" repeatCount="indefinite"/></circle>
<text x="600" y="318" text-anchor="middle" class="m a" font-size="12" letter-spacing="3">CORE IDENTITY</text>
<text x="600" y="350" text-anchor="middle" class="s h" font-size="24" font-weight="800">SYSTEMS</text><text x="600" y="381" text-anchor="middle" class="s h" font-size="24" font-weight="800">ENGINEER</text>

<!-- connectors -->
<g stroke="#8b5cf6" stroke-opacity=".32" stroke-width="1.5" stroke-dasharray="5 8"><path d="M505 290L370 205"/><path d="M695 290L830 205"/><path d="M505 400L370 492"/><path d="M695 400L830 492"/></g>

<!-- backend -->
<g><rect x="80" y="110" width="330" height="150" rx="18" fill="#090d20" stroke="#7c3aed" stroke-opacity=".55"/><circle cx="112" cy="140" r="7" fill="#7c3aed"><animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/></circle><text x="132" y="147" class="m a" font-size="13">BACKEND / SYSTEMS</text><text x="108" y="181" class="s h" font-size="18" font-weight="700">Services built for motion.</text><text x="108" y="210" class="s p" font-size="14">APIs · Auth · Events · Real-time flows</text><text x="108" y="235" class="m" fill="#64748b" font-size="12">REST  WEBSOCKET  SSE  ORCHESTRATION</text></g>
<!-- security -->
<g><rect x="790" y="110" width="330" height="150" rx="18" fill="#090d20" stroke="#a78bfa" stroke-opacity=".55"/><circle cx="822" cy="140" r="7" fill="#a78bfa"><animate attributeName="opacity" values=".45;1;.45" dur="1.8s" repeatCount="indefinite"/></circle><text x="842" y="147" class="m a" font-size="13">SECURITY / INTELLIGENCE</text><text x="818" y="181" class="s h" font-size="18" font-weight="700">Security as architecture.</text><text x="818" y="210" class="s p" font-size="14">Threat intel · Compliance · Hardening</text><text x="818" y="235" class="m" fill="#64748b" font-size="12">OPENCTI  CIS-CAT  AUTHN/Z  DEFENSE</text></g>
<!-- ai -->
<g><rect x="80" y="435" width="330" height="150" rx="18" fill="#090d20" stroke="#22d3ee" stroke-opacity=".5"/><circle cx="112" cy="465" r="7" fill="#22d3ee"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle><text x="132" y="472" class="m" fill="#67e8f9" font-size="13">APPLIED AI / RETRIEVAL</text><text x="108" y="506" class="s h" font-size="18" font-weight="700">Intelligence with context.</text><text x="108" y="535" class="s p" font-size="14">RAG · Embeddings · Vector search</text><text x="108" y="560" class="m" fill="#64748b" font-size="12">DOCUMENT AI  RETRIEVAL  LLM SYSTEMS</text></g>
<!-- creative -->
<g><rect x="790" y="435" width="330" height="150" rx="18" fill="#090d20" stroke="#c084fc" stroke-opacity=".5"/><circle cx="822" cy="465" r="7" fill="#c084fc"><animate attributeName="r" values="6;9;6" dur="2.8s" repeatCount="indefinite"/></circle><text x="842" y="472" class="m" fill="#d8b4fe" font-size="13">CREATIVE / INTERACTION</text><text x="818" y="506" class="s h" font-size="18" font-weight="700">Interfaces with intent.</text><text x="818" y="535" class="s p" font-size="14">Motion · Type · Accessibility · Speed</text><text x="818" y="560" class="m" fill="#64748b" font-size="12">NEXT.JS  GSAP  UI SYSTEMS  UX</text></g>

<circle r="5" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M220,345 A380,220 0 1,1 980,345 A380,220 0 1,1 220,345"/></circle>
<circle r="4" fill="#22d3ee" filter="url(#glow)"><animateMotion dur="7s" begin="-2s" repeatCount="indefinite" path="M330,345 A270,155 0 1,0 870,345 A270,155 0 1,0 330,345"/></circle>
</svg>