<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">System dossier for Nguyen Van Hai</title>
<desc id="desc">Backend engineer, security builder, applied AI explorer, and creative technologist based in Vietnam.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="0.55" stop-color="#0b1024"/><stop offset="1" stop-color="#111333"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8b5cf6" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1200" height="430" rx="24"/></clipPath>
</defs>
<style>
  .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:"JetBrains Mono",Consolas,monospace}
  .label{font-size:13px;letter-spacing:3px;fill:#a78bfa}.muted{fill:#94a3b8}.white{fill:#f8fafc}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <circle cx="1050" cy="-20" r="260" fill="#6d28d9" opacity=".11" filter="url(#glow)"/>
  <circle cx="150" cy="455" r="210" fill="#0891b2" opacity=".08" filter="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#8b5cf6" stroke-opacity=".35"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)"/>
  <circle cx="31" cy="31" r="5" fill="#fb7185"/><circle cx="49" cy="31" r="5" fill="#fbbf24"/><circle cx="67" cy="31" r="5" fill="#34d399"/>
  <text x="92" y="36" class="mono label">SYSTEM DOSSIER / 01</text>
  <text x="1125" y="36" text-anchor="end" class="mono" font-size="12" fill="#64748b">STATUS: OPERATIONAL</text>

  <text x="62" y="108" class="sans white" font-size="18" font-weight="600" letter-spacing="2">NGUYEN VAN HAI</text>
  <text x="62" y="158" class="sans white" font-size="42" font-weight="800">I DESIGN SYSTEMS</text>
  <text x="62" y="207" class="sans white" font-size="42" font-weight="800">THAT <tspan fill="url(#accent)">THINK, SCALE</tspan></text>
  <text x="62" y="256" class="sans white" font-size="42" font-weight="800">AND DEFEND.</text>
  <text x="64" y="304" class="sans muted" font-size="17">Backend engineering · Cybersecurity · Applied AI · Creative technology</text>
  <text x="64" y="344" class="sans" font-size="15" fill="#cbd5e1">Building products whose architecture, security, intelligence, and interaction</text>
  <text x="64" y="369" class="sans" font-size="15" fill="#cbd5e1">behave as one deliberate system — not a collection of disconnected parts.</text>

  <rect x="735" y="78" width="405" height="285" rx="16" fill="#030712" fill-opacity=".84" stroke="#7c3aed" stroke-opacity=".45"/>
  <rect x="735" y="78" width="405" height="38" rx="16" fill="#111827"/><rect x="735" y="100" width="405" height="16" fill="#111827"/>
  <text x="758" y="102" class="mono" font-size="12" fill="#94a3b8">hai@systems: ~/identity</text>
  <text x="760" y="148" class="mono" font-size="14" fill="#a78bfa">$ identity</text>
  <text x="760" y="174" class="mono" font-size="14" fill="#e2e8f0">backend engineer / security builder</text>
  <text x="760" y="200" class="mono" font-size="14" fill="#e2e8f0">applied-ai explorer / creative technologist</text>
  <text x="760" y="238" class="mono" font-size="14" fill="#a78bfa">$ origin</text>
  <text x="760" y="264" class="mono" font-size="14" fill="#e2e8f0">Vietnam · UTC+7</text>
  <text x="760" y="302" class="mono" font-size="14" fill="#a78bfa">$ doctrine</text>
  <text x="760" y="328" class="mono" font-size="14" fill="#e2e8f0">build with depth. ship with intent.</text>
  <rect x="1040" y="316" width="9" height="17" fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

  <rect x="0" y="-70" width="1200" height="70" fill="url(#accent)" opacity=".035">
    <animate attributeName="y" from="-70" to="430" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>