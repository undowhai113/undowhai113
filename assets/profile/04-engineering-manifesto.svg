<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Engineering range and manifesto</title><desc id="desc">Product, systems, security, and intelligence are connected by a principle of clarity under pressure.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#12132f"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.s{font-family:Inter,Segoe UI,Arial,sans-serif}.m{font-family:"JetBrains Mono",Consolas,monospace}.h{fill:#f8fafc}.p{fill:#94a3b8}.x{fill:#a78bfa}</style>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#8b5cf6" stroke-opacity=".32"/>
<text x="42" y="48" class="m x" font-size="13" letter-spacing="3">ENGINEERING RANGE / 04</text><text x="1158" y="48" text-anchor="end" class="m p" font-size="12">ONE SYSTEM. FOUR LENSES.</text>
<g transform="translate(42 76)">
  <g><rect width="265" height="92" rx="14" fill="#090d20" stroke="#7c3aed" stroke-opacity=".45"/><text x="22" y="31" class="m x" font-size="12">PRODUCT</text><text x="22" y="60" class="s h" font-size="17" font-weight="700">Useful by default.</text><text x="22" y="80" class="m p" font-size="11">DELIVER · TEST · REFINE</text></g>
  <g transform="translate(283 0)"><rect width="265" height="92" rx="14" fill="#090d20" stroke="#a78bfa" stroke-opacity=".45"/><text x="22" y="31" class="m x" font-size="12">SYSTEMS</text><text x="22" y="60" class="s h" font-size="17" font-weight="700">Coherent at scale.</text><text x="22" y="80" class="m p" font-size="11">ARCHITECT · CONNECT · OPERATE</text></g>
  <g transform="translate(566 0)"><rect width="265" height="92" rx="14" fill="#090d20" stroke="#c084fc" stroke-opacity=".45"/><text x="22" y="31" class="m" fill="#d8b4fe" font-size="12">SECURITY</text><text x="22" y="60" class="s h" font-size="17" font-weight="700">Resilient by design.</text><text x="22" y="80" class="m p" font-size="11">OBSERVE · VERIFY · DEFEND</text></g>
  <g transform="translate(849 0)"><rect width="265" height="92" rx="14" fill="#090d20" stroke="#22d3ee" stroke-opacity=".42"/><text x="22" y="31" class="m" fill="#67e8f9" font-size="12">INTELLIGENCE</text><text x="22" y="60" class="s h" font-size="17" font-weight="700">Context before output.</text><text x="22" y="80" class="m p" font-size="11">RETRIEVE · REASON · DECIDE</text></g>
</g>
<text x="600" y="225" text-anchor="middle" class="s h" font-size="31" font-weight="800">BUILD SYSTEMS THAT REMAIN</text>
<text x="600" y="266" text-anchor="middle" class="s" font-size="31" font-weight="800" fill="url(#a)" filter="url(#glow)">UNDERSTANDABLE UNDER PRESSURE.</text>
<text x="600" y="310" text-anchor="middle" class="s p" font-size="15">Security is a constraint · Performance is a feature · Infrastructure is part of the product</text>
<rect x="420" y="332" width="360" height="2" fill="url(#a)"><animate attributeName="width" values="80;360;80" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="560;420;560" dur="4s" repeatCount="indefinite"/></rect>
</svg>