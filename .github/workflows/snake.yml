name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Platane/snk contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/profile/github-snake-dark.svg?palette=github-dark&color_snake=#2ac3de&color_dots=#161b22,#1f3a68,#3d59a1,#7aa2f7,#bb9af7

      - name: Commit and push updated snake SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/profile/github-snake-dark.svg || [ -n "$(git status --porcelain -- assets/profile/github-snake-dark.svg)" ]; then
            git add assets/profile/github-snake-dark.svg
            git commit -m "chore: update contribution snake"
            git push
          fi
